# detekt のデフォルト設定を土台に、Compose 向けの緩和のみを記述する。
# (buildUponDefaultConfig = true のため、ここに書いたキーだけが上書きされる)

complexity:
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
    # 計測エンジンのような状態機械は、小さな private ハンドラへ分けるほど関数が増える。
    # 1関数あたりを短く保つ方を優先する。
    thresholdInClasses: 15
  LongParameterList:
    # DI で依存を受け取るクラスは引数が増える。まとめるための箱を作る方が読みにくい。
    constructorThreshold: 12
    # Composable は「状態 + コールバック + Modifier」で引数が増えるのが普通の形。
    ignoreAnnotated: ['Composable']
  LongMethod:
    # 画面の組み立ては上から下へ読める1本の関数の方が追いやすい。
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test']

style:
  ReturnCount:
    # 位置サンプルのフィルタは「条件に合わなければ理由をつけて即返す」ガード節の連続で書く。
    # ネストして1箇所で返すより、棄却理由と条件の対応が読み取りやすいため上限を緩める。
    max: 10
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
  MaxLineLength:
    maxLineLength: 120
  # @Preview の private Composable は参照が無くても未使用ではない
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
